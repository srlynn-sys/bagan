<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05030a">
<title>Bagan — A Memory in Orbit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#f7ead7}body{font-family:Georgia,'Times New Roman',serif}.intro{--mx:0px;--my:0px;position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:#07040b;isolation:isolate}.intro:before{content:'';position:absolute;inset:-10%;background-image:linear-gradient(110deg,rgba(3,2,8,.84),rgba(8,4,12,.28)),linear-gradient(0deg,rgba(3,2,8,.35),rgba(3,2,8,.08)),url('https://lh3.googleusercontent.com/d/1Qqbqb0PGfz9gXSbXrmHnBOL_2GUFtIKx');background-position:center;background-size:cover;background-repeat:no-repeat;filter:saturate(.72) contrast(1.04);transform:translate3d(calc(var(--mx)*-.35),calc(var(--my)*-.35),0) scale(1.06);animation:breath 14s ease-in-out infinite alternate;transition:filter 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1)}.intro:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.22) 52%,rgba(0,0,0,.72) 100%),linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42));z-index:2}.dust{position:absolute;inset:0;z-index:1;background-image:radial-gradient(circle,rgba(255,218,166,.7) 0 1px,transparent 1.5px);background-size:87px 93px;opacity:.18;animation:drift 22s linear infinite}.dust:after{content:'';position:absolute;inset:-30%;background-image:radial-gradient(circle,rgba(255,188,100,.65) 0 1px,transparent 1.7px);background-size:137px 151px;opacity:.32;animation:drift2 31s linear infinite}.center{position:relative;z-index:4;text-align:center;width:min(800px,90vw);transform:translate3d(calc(var(--mx)*.12),calc(var(--my)*.12),0);animation:rise 1.4s ease both;transition:transform .35s ease,opacity .7s ease,filter .7s ease}.eyebrow{font:10px monospace;letter-spacing:.45em;color:#e4a45d;animation:softPulse 4s ease-in-out infinite}.title{margin:25px 0 12px;font-size:clamp(64px,11vw,150px);line-height:.78;font-weight:400;letter-spacing:-.065em;text-shadow:0 12px 60px #000;animation:titleGlow 5s ease-in-out infinite}.title em{display:block;color:#e4ad70;font-style:italic;font-size:.62em;margin-top:22px}.sub{margin:28px auto 42px;color:#d1c1ad;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.enter{position:relative;overflow:hidden;border:1px solid rgba(237,178,105,.6);background:rgba(8,5,10,.42);color:#f2c17f;padding:16px 28px;letter-spacing:.22em;text-transform:uppercase;font:10px monospace;cursor:pointer;backdrop-filter:blur(8px);transition:.4s;box-shadow:0 0 0 rgba(228,164,91,0)}.enter:before{content:'';position:absolute;top:-80%;left:-45%;width:35%;height:260%;background:linear-gradient(90deg,transparent,rgba(255,224,175,.55),transparent);transform:rotate(18deg) translateX(-220%);transition:transform .8s ease}.enter:hover:before{transform:rotate(18deg) translateX(520%)}.enter:hover{background:#e2a45b;color:#160b08;box-shadow:0 0 45px rgba(228,164,91,.25),0 0 90px rgba(228,164,91,.08);transform:translateY(-3px) scale(1.025)}.enter:active{transform:translateY(-1px) scale(.985)}.line{position:absolute;z-index:4;left:7vw;right:7vw;bottom:32px;height:1px;background:linear-gradient(90deg,transparent,#dca46655,transparent)}.corner{position:absolute;z-index:4;bottom:43px;font:8px monospace;letter-spacing:.2em;color:#9f8c78}.left{left:7vw}.right{right:7vw}.light-sweep{position:absolute;z-index:3;inset:-25%;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(235,177,103,.08) 48%,rgba(255,218,166,.18) 50%,rgba(235,177,103,.05) 52%,transparent 60%);transform:translateX(-70%) rotate(4deg);animation:sweep 9s ease-in-out infinite}.intro.is-exiting:before{filter:saturate(1.15) brightness(1.12) blur(7px);transform:scale(1.2)}.intro.is-exiting .center{opacity:0;filter:blur(10px);transform:scale(1.12) translate3d(calc(var(--mx)*.12),calc(var(--my)*.12),0)}.intro.is-exiting .dust,.intro.is-exiting .light-sweep{opacity:0;transition:opacity .65s ease}.intro.is-exiting:after{background:radial-gradient(circle,rgba(226,164,91,.2),rgba(0,0,0,.94) 70%);transition:background .8s ease}@keyframes breath{to{transform:translate3d(calc(var(--mx)*-.35),calc(var(--my)*-.35),0) scale(1.13);filter:saturate(.86) brightness(1.05)}}@keyframes drift{to{transform:translate3d(45px,-70px,0)}}@keyframes drift2{to{transform:translate3d(-65px,85px,0)}}@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.985)}to{opacity:1;transform:none}}@keyframes softPulse{0%,100%{opacity:.7;filter:blur(.1px)}50%{opacity:1;filter:blur(0)}}@keyframes titleGlow{0%,100%{text-shadow:0 12px 60px #000}50%{text-shadow:0 12px 70px #000,0 0 30px rgba(228,164,91,.12)}}@keyframes sweep{0%,18%{transform:translateX(-85%) rotate(4deg);opacity:0}35%{opacity:1}65%,100%{transform:translateX(85%) rotate(4deg);opacity:0}}@media(max-width:600px){.corner{display:none}.sub{line-height:1.8}.title{font-size:72px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.intro:before{transform:scale(1.06)}}
</style>
<link rel="stylesheet" href="intro-enhancements.css">
<link rel="stylesheet" href="intro-mobile-smooth.css">
</head>
<body>
<main class="intro" id="intro">
<div class="dust"></div><div class="light-sweep"></div><div class="center"><div class="eyebrow">MYANMAR · BAGAN · MEMORY ARCHIVE</div><h1 class="title">Bagan<em>in orbit.</em></h1><p class="sub">55 frames · one journey · a sky full of memories</p><button class="enter" id="enterGalaxy"><span class="enter-dot"></span>Enter the memory galaxy <span aria-hidden="true">→</span></button></div>
<div class="line"></div><div class="corner left">21°10′N · 94°52′E</div><div class="corner right">SCROLL / DRAG / EXPLORE</div>
</main>
<script>
const intro=document.getElementById('intro');
const enter=document.getElementById('enterGalaxy');
let leaving=false;
window.addEventListener('pointermove',e=>{
  if(leaving)return;
  const x=(e.clientX/window.innerWidth-.5)*2;
  const y=(e.clientY/window.innerHeight-.5)*2;
  intro.style.setProperty('--mx',`${x*14}px`);
  intro.style.setProperty('--my',`${y*10}px`);
});
enter.addEventListener('click',()=>{
  if(leaving)return;
  leaving=true;
  sessionStorage.setItem('baganMusic','playing');
  intro.classList.add('is-exiting');
  setTimeout(()=>{location.href='galaxy.html?music=1'},760);
});
</script>
<script src="intro-enhancements.js"></script>
</body>
</html>
